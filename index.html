<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007985" />
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("foli-theme-v1");
        } catch {
          // A blocked preference store must not delay first paint.
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            globalThis.matchMedia?.("(prefers-color-scheme: dark)")?.matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0c1416" : "#007985");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Turku Departures" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%foli-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="description"
      content="Live Turku bus times, disruptions and get-off alerts. Privacy-first, no account, no ads. Independent app using Föli open data."
    />
    <title>Turku Departures · Live bus times &amp; get-off alerts</title>
    <link rel="canonical" href="%VITE_SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Turku Departures" />
    <meta property="og:title" content="Know what leaves next. Know when to press STOP." />
    <meta
      property="og:description"
      content="Turku Departures: live bus times, disruptions and get-off alerts for Turku. Privacy-first, no account, no ads. Independent app using Föli open data."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:image" content="%VITE_SITE_URL%social-card.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />

    <meta
      property="og:image:alt"
      content="Turku Departures brand card: Know what leaves next. Know when to press STOP, with a Puistokatu get-off alert preview."
    />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="fi_FI" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>

</html>
