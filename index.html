<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#007985" />
    <script>
      (() => {
        let theme = null;
        try {
          theme = localStorage.getItem("foli-theme-v1");
        } catch {
          // A blocked preference store must not delay first paint.
        }
        if (theme !== "light" && theme !== "dark") {
          theme =
            globalThis.matchMedia?.("(prefers-color-scheme: dark)")?.matches
              ? "dark"
              : "light";
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document
          .querySelector('meta[name="theme-color"]')
          ?.setAttribute("content", theme === "dark" ? "#0c1416" : "#007985");
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Turku Föli" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%foli-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta
      name="description"
      content="Live Turku bus departures, service updates and an alert that tells you when to press STOP. Free, no account, no ads. Not an official Föli app."
    />
    <title>Turku bus departures · Föli live times</title>

  </head>
