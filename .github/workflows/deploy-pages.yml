name: Deploy production site

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  # Only a CI run that is actually allowed to deploy shares the production
  # concurrency group. An ineligible workflow_run (for example Dependabot's
  # PR CI) gets its own group, so it cannot cancel a valid Pages deployment
  # before the build job's trust condition is evaluated.
  group: >-
    ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      'github-pages' ||
      format('non-production-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /foli-live-departures/
    steps:
      - name: Verify merged PR provenance before repository code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          pull="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/pulls" \
              | jq -r --arg sha "$CANDIDATE_SHA" \
                  '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "master" and .merge_commit_sha == $sha) | .number' \
              | head -n 1
          )"
          test -n "$pull" || {
            echo "Refusing release path: $CANDIDATE_SHA is not the exact merge commit of a merged PR into master."
            exit 1
          }
          echo "Verified merged PR #$pull for $CANDIDATE_SHA."

      - name: Checkout verified revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production site
        run: npm run build

      - name: Stamp exact verified revision
        env:
          DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run stamp:deployment

      - name: Verify the shipped Content-Security-Policy
        run: npm run verify:csp

      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload production artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact deployed revision for live smoke
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup Node for live smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify exact production deployment
        env:
          PRODUCTION_SITE_URL: ${{ needs.deploy.outputs.page_url }}
          EXPECTED_DEPLOYMENT_SHA: ${{ github.event.workflow_run.head_sha }}
        run: npm run verify:production-site
