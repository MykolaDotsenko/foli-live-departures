name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-apk.yml"
      - "scripts/build-sw.mjs"
      - "scripts/configure-android-active-ride.mjs"
      - "scripts/verify-android-play-target.mjs"
      - "scripts/verify-play-*.mjs"
      - "scripts/build-play-store-assets.mjs"
      - "e2e/play-store-screenshots.spec.js"
      - "play/**"
      - "docs/ANDROID_RELEASE.md"
      - "docs/PRODUCTION_READINESS.md"
      - "docs/PRODUCTION_ROADMAP.md"
      # Release-governance docs participate in exact-SHA Android evidence.
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.config.*"

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor Android toolchain
        run: |
          npm install --no-save \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2

      - name: Build web application
        env:
          VITE_BASE_PATH: /
          VITE_NATIVE_BUILD: "true"
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify native provider trust boundary
        run: npm run verify:native-boundary

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android active-ride bridge
        run: npm run configure:android-active-ride

      - name: Verify Google Play API target and permission surface
        run: npm run verify:android-play-target

      - name: Apply Turku Departures launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" public/foli-icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M126,128c0,-27 22,-48 48,-48h164c27,0 48,21 48,48v198c0,23 -16,42 -38,47v35c0,13 -11,24 -24,24h-10c-13,0 -24,-11 -24,-24v-32h-68v32c0,13 -11,24 -24,24h-10c-13,0 -24,-11 -24,-24v-35c-22,-5 -38,-24 -38,-47V128ZM182,140v104h148V140H182ZM203,300a30,30 0,1 0,0 60,30 30,0 0,0 0,-60ZM309,300a30,30 0,1 0,0 60,30 30,0 0,0 0,-60Z" />
          </vector>
          XML

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#007985</color>
          </resources>
          XML

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build installable APK
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle build attempt $attempt failed; retrying after a short delay."
            sleep $((attempt * 10))
          done

      - name: Normalize APK filename and checksum
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Turku-Departures.apk
          sha256sum Turku-Departures.apk > Turku-Departures.apk.sha256

      - name: Upload APK workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Turku-Departures-Android-APK
          path: |
            Turku-Departures.apk
            Turku-Departures.apk.sha256
          if-no-files-found: error
          retention-days: 30
