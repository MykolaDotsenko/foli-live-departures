name: One-shot supported toolchain refresh

on:
  push:
    branches:
      - feature/pre-field-batch-17-24-qa-locales
    paths:
      - ".github/workflows/toolchain-refresh.yml"

permissions:
  contents: write

concurrency:
  group: one-shot-toolchain-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout exact feature revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/pre-field-batch-17-24-qa-locales

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Refresh only within declared semver and peer-compatible ranges
        run: npm update

      - name: Runtime dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: PWA
        run: npm run verify:pwa

      - name: CSP
        run: npm run verify:csp

      - name: Bundle
        run: npm run verify:bundle

      - name: Architecture and policy gates
        run: |
          npm run verify:architecture
          npm run verify:place-search-policy
          npm run verify:live-contract
          npm run verify:workflow-pins

      - name: Commit refreshed lockfile and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/toolchain-refresh.yml
          git add package.json package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh supported dependency lockfile"
          git push origin HEAD:feature/pre-field-batch-17-24-qa-locales
