name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Runtime dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type-check the data layer
        run: npm run typecheck

      - name: Verify branding consistency
        run: npm run verify:brand

      - name: Verify deployment trust boundary
        run: npm run verify:deployment

      - name: Verify backendless PWA architecture
        run: npm run verify:architecture

      - name: Verify Android release contract
        run: npm run verify:android-release

      - name: Verify tested Android artifact publication
        run: npm run verify:android-publish

      - name: Verify immutable workflow action pins
        run: npm run verify:workflow-pins

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Verify Föli API reference
        run: npm run verify:api-reference

      - name: Build
        run: npm run build

      - name: Verify PWA precache
        run: npm run verify:pwa

      - name: Verify production bundle budget
        run: npm run verify:bundle

      - name: Verify Content-Security-Policy
        run: npm run verify:csp

      # Production is served from a GitHub Pages subpath (deploy-pages.yml),
      # and a path that only resolves at "/" passes every check above.
      - name: Verify PWA under the production base path
        env:
          VITE_BASE_PATH: /foli-live-departures/
        run: |
          npm run build
          npm run verify:pwa
          npm run verify:csp

  browser-qa:
    needs: unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser E2E and accessibility
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload product screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: foli-product-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14
