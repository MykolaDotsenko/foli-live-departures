name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify branding consistency
        run: npm run verify:brand

      - name: Unit tests with coverage gate
        run: npm run test:coverage

      - name: Verify Föli API reference
        run: npm run verify:api-reference

      - name: Build
        run: npm run build

      - name: Verify PWA precache
        run: npm run verify:pwa

      - name: Verify production bundle budget
        run: npm run verify:bundle

      # Production is served from a GitHub Pages subpath (deploy-pages.yml),
      # and a path that only resolves at "/" passes every check above.
      - name: Verify PWA under the production base path
        env:
          VITE_BASE_PATH: /foli-live-departures/
        run: |
          npm run build
          npm run verify:pwa

  browser-qa:
    needs: unit-build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Cross-browser E2E and accessibility
        run: npm run test:e2e

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload product screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foli-product-screenshots
          path: artifacts/screenshots
          if-no-files-found: ignore
          retention-days: 14
