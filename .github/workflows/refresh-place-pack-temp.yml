name: Temporary OSM geometry diagnostic

on:
  push:
    branches:
      - claude/tender-sagan-qtyuc6

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect problematic OSM way
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, urllib.request
          url = "https://api.openstreetmap.org/api/0.6/way/394920306/full.json"
          req = urllib.request.Request(url, headers={"User-Agent": "foli-live-departures-diagnostic"})
          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.load(response)
          way = next(e for e in data["elements"] if e["type"] == "way" and e["id"] == 394920306)
          nodes = {e["id"]: e for e in data["elements"] if e["type"] == "node"}
          coords = [(nodes[n]["lat"], nodes[n]["lon"]) for n in way["nodes"] if n in nodes]
          print("tags=", json.dumps(way.get("tags", {}), ensure_ascii=False, sort_keys=True))
          print("nodes=", len(coords))
          print("lat_min=", min(lat for lat, _ in coords), "lat_max=", max(lat for lat, _ in coords))
          print("lon_min=", min(lon for _, lon in coords), "lon_max=", max(lon for _, lon in coords))
          print("bbox_center=", (
              (min(lat for lat, _ in coords) + max(lat for lat, _ in coords)) / 2,
              (min(lon for _, lon in coords) + max(lon for _, lon in coords)) / 2,
          ))
          PY
