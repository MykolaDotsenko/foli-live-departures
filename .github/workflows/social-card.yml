name: Refresh social card

on:
  push:
    branches: ["master"]
    paths:
      - "scripts/build-social-card.mjs"
      - "public/foli-icon.svg"
      - ".github/workflows/social-card.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: social-card-master
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Render social artwork
        run: node scripts/build-social-card.mjs

      - name: Commit refreshed artwork
        run: |
          if git diff --quiet -- docs/assets/turku-departures-social-card.jpg public/social-card.jpg; then
            echo "Social artwork already matches its generator."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/turku-departures-social-card.jpg public/social-card.jpg
          git commit -m "chore: refresh Turku Departures social artwork"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
