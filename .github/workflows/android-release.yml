name: Release Android

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version without the v prefix, for example 1.0.0
        required: true
        type: string
      version_code:
        description: Monotonically increasing Android integer version code
        required: true
        type: string
      publish:
        description: Publish an immutable GitHub release after verification
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: android-production-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: android-production
    env:
      VERSION_NAME: ${{ inputs.version_name }}
      VERSION_CODE: ${{ inputs.version_code }}
      PACKAGE_ID: io.github.mykoladotsenko.turkudepartures

    steps:
      - name: Verify merged PR provenance before repository code
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          pull="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "/repos/$GITHUB_REPOSITORY/commits/$CANDIDATE_SHA/pulls" \
              | jq -r --arg sha "$CANDIDATE_SHA" \
                  '.[] | select(.state == "closed" and .merged_at != null and .base.ref == "master" and .merge_commit_sha == $sha) | .number' \
              | head -n 1
          )"
          test -n "$pull" || {
            echo "Refusing production signing: $CANDIDATE_SHA is not the exact merge commit of a merged PR into master."
            exit 1
          }
          echo "Verified merged PR #$pull for $CANDIDATE_SHA."

      - name: Checkout verified master
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Validate release inputs and signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]] || {
            echo "version_name must be semantic version text such as 1.0.0"
            exit 1
          }
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]] || {
            echo "version_code must be a positive integer"
            exit 1
          }
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is required}"
          : "${ANDROID_KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is required}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS is required}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD is required}"

      - name: Require increasing production version code
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          releases="$RUNNER_TEMP/production-releases.json"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[]' \
            | jq -s '.' > "$releases"
          node scripts/android-release-metadata.mjs \
            check-version "$VERSION_CODE" "$releases"

      - name: Require successful CI for this exact master commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          match="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=master&event=push&status=success&per_page=20" \
              | jq -r --arg sha "$GITHUB_SHA" \
                  '.workflow_runs[] | select(.head_sha == $sha) | .id' \
              | head -n 1
          )"
          test -n "$match" || {
            echo "No successful master CI run exists for exact commit $GITHUB_SHA."
            exit 1
          }
          echo "Verified successful CI run $match for $GITHUB_SHA."

      - name: Install web dependencies
        run: npm ci

      - name: Runtime dependency vulnerability gate
        run: npm audit --omit=dev --audit-level=high

      - name: Install pinned Capacitor Android toolchain
        run: |
          npm install --no-save \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2

      - name: Build native web payload
        env:
          VITE_BASE_PATH: /
          VITE_NATIVE_BUILD: "true"
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_APP_VERSION: ${{ inputs.version_name }}
        run: |
          npm run build
          npm run verify:csp
          npm run verify:native-boundary

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android active-ride bridge
        run: npm run configure:android-active-ride

      - name: Verify Google Play API target and permission surface
        run: npm run verify:android-play-target

      - name: Configure Android release version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          source, code_count = re.subn(
              r"\bversionCode\s+\d+",
              f"versionCode {int(os.environ['VERSION_CODE'])}",
              source,
              count=1,
          )
          source, name_count = re.subn(
              r'\bversionName\s+"[^"]*"',
              f'versionName "{os.environ["VERSION_NAME"]}"',
              source,
              count=1,
          )
          if code_count != 1 or name_count != 1:
              raise SystemExit("Could not set Android versionCode/versionName deterministically.")
          gradle.write_text(source)
          PY

      - name: Apply Turku Departures launcher icon
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin

          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            rsvg-convert -w "$size" -h "$size" public/foli-icon.svg -o "$dir/ic_launcher.png"
            cp "$dir/ic_launcher.png" "$dir/ic_launcher_round.png"
          done

          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_launcher_foreground.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="512"
              android:viewportHeight="512">
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M126,128c0,-27 22,-48 48,-48h164c27,0 48,21 48,48v198c0,23 -16,42 -38,47v35c0,13 -11,24 -24,24h-10c-13,0 -24,-11 -24,-24v-32h-68v32c0,13 -11,24 -24,24h-10c-13,0 -24,-11 -24,-24v-35c-22,-5 -38,-24 -38,-47V128ZM182,140v104h148V140H182ZM203,300a30,30 0,1 0,0 60,30 30,0 0,0 0,-60ZM309,300a30,30 0,1 0,0 60,30 30,0 0,0 0,-60Z" />
          </vector>
          XML

          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#007985</color>
          </resources>
          XML

          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          XML
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Build unsigned release APK and AAB
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --no-daemon

      - name: Decode production signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          install -m 700 -d "$RUNNER_TEMP/turku-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/turku-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/turku-signing/release.keystore"

      - name: Sign and verify exact release artifacts
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          tools_dir="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          unsigned_apk="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          unsigned_aab="android/app/build/outputs/bundle/release/app-release.aab"
          aligned_apk="$RUNNER_TEMP/Turku-Departures-aligned.apk"
          apk="Turku-Departures-v$VERSION_NAME.apk"
          aab="Turku-Departures-v$VERSION_NAME.aab"
          keystore="$RUNNER_TEMP/turku-signing/release.keystore"

          test -s "$unsigned_apk"
          test -s "$unsigned_aab"

          "$tools_dir/zipalign" -f -p 4 "$unsigned_apk" "$aligned_apk"
          "$tools_dir/apksigner" sign \
            --ks "$keystore" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$apk" \
            "$aligned_apk"
          cert_output="$("$tools_dir/apksigner" verify --verbose --print-certs "$apk")"
          printf '%s\n' "$cert_output"
          cert_sha256="$(
            printf '%s\n' "$cert_output" \
              | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' \
              | head -n 1 \
              | tr '[:upper:]' '[:lower:]'
          )"
          [[ "$cert_sha256" =~ ^[0-9a-f]{64}$ ]] || {
            echo "Could not extract the production signing certificate SHA-256 digest."
            exit 1
          }
          echo "ANDROID_CERT_SHA256=$cert_sha256" >> "$GITHUB_ENV"

          jarsigner \
            -keystore "$keystore" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -keypass "$ANDROID_KEY_PASSWORD" \
            -signedjar "$aab" \
            "$unsigned_aab" \
            "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose "$aab"

          sha256sum "$apk" "$aab" > "Turku-Departures-v$VERSION_NAME.sha256"

      - name: Remove production signing key
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/turku-signing"

      - name: Write immutable release metadata
        shell: bash
        run: |
          set -euo pipefail
          apk="Turku-Departures-v$VERSION_NAME.apk"
          aab="Turku-Departures-v$VERSION_NAME.aab"
          metadata="Turku-Departures-v$VERSION_NAME.release.json"
          export APK_SHA256="$(sha256sum "$apk" | awk '{print $1}')"
          export AAB_SHA256="$(sha256sum "$aab" | awk '{print $1}')"
          node scripts/android-release-metadata.mjs write "$metadata"

      - name: Verify signed release APK on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -euo pipefail
            apk="Turku-Departures-v$VERSION_NAME.apk"
            adb install -r "$apk"
            adb shell am force-stop "$PACKAGE_ID"
            adb shell am start -W -n "$PACKAGE_ID/.MainActivity"
            sleep 4
            adb shell pidof "$PACKAGE_ID" >/dev/null
            adb shell uiautomator dump /sdcard/turku-window.xml >/dev/null
            adb pull /sdcard/turku-window.xml "$RUNNER_TEMP/turku-window.xml" >/dev/null
            grep -q "Turku Departures" "$RUNNER_TEMP/turku-window.xml"

      - name: Upload verified release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Turku-Departures-v${{ inputs.version_name }}
          path: |
            Turku-Departures-v${{ inputs.version_name }}.apk
            Turku-Departures-v${{ inputs.version_name }}.aab
            Turku-Departures-v${{ inputs.version_name }}.sha256
            Turku-Departures-v${{ inputs.version_name }}.release.json
          if-no-files-found: error
          retention-days: 30

  publish:
    if: inputs.publish
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download verified production artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: Turku-Departures-v${{ inputs.version_name }}
          path: release-assets

      - name: Verify downloaded production checksums and metadata
        working-directory: release-assets
        env:
          EXPECTED_VERSION_NAME: ${{ inputs.version_name }}
          EXPECTED_VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c "Turku-Departures-v$EXPECTED_VERSION_NAME.sha256"
          node - <<'NODE'
          const fs = require("node:fs");
          const version = process.env.EXPECTED_VERSION_NAME;
          const code = Number(process.env.EXPECTED_VERSION_CODE);
          const metadata = JSON.parse(
            fs.readFileSync(`Turku-Departures-v${version}.release.json`, "utf8")
          );
          if (
            metadata.schema !== 1 ||
            metadata.versionName !== version ||
            metadata.versionCode !== code ||
            metadata.commitSha !== process.env.GITHUB_SHA
          ) {
            throw new Error("Downloaded Android release metadata does not match this workflow dispatch.");
          }
          NODE

      - name: Publish verified immutable-version release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite a production version."
            exit 1
          fi
          notes="$(
            printf '%s\n\nAndroid-Version-Code: %s\nSource-Commit: %s\n' \
              "Production-signed Android release from verified master commit \`$GITHUB_SHA\`. APK and AAB were signed with the persistent production key; the exact APK was installed and launch-smoke-tested on Android API 35 before publication." \
              "$VERSION_CODE" \
              "$GITHUB_SHA"
          )"
          gh release create "$tag" \
            "release-assets/Turku-Departures-v$VERSION_NAME.apk" \
            "release-assets/Turku-Departures-v$VERSION_NAME.aab" \
            "release-assets/Turku-Departures-v$VERSION_NAME.sha256" \
            "release-assets/Turku-Departures-v$VERSION_NAME.release.json" \
            --target "$GITHUB_SHA" \
            --title "Turku Departures v$VERSION_NAME" \
            --notes "$notes"
