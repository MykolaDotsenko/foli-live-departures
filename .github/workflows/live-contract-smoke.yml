name: Live Föli contract smoke

on:
  push:
    branches:
      - master
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foli-live-contract
  cancel-in-progress: true

jobs:
  contract-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify public Föli API contracts
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          async function getJson(url, attempts = 3) {
            let lastError;

            for (let attempt = 1; attempt <= attempts; attempt += 1) {
              const controller = new AbortController();
              const timeout = setTimeout(() => controller.abort(), 10_000);

              try {
                const response = await fetch(url, {
                  headers: { Accept: "application/json" },
                  signal: controller.signal,
                });

                if (!response.ok) {
                  throw new Error(`${url} returned HTTP ${response.status}`);
                }

                return await response.json();
              } catch (error) {
                lastError = error;
                if (attempt < attempts) await wait(attempt * 4_000);
              } finally {
                clearTimeout(timeout);
              }
            }

            throw lastError;
          }

          const base = "https://data.foli.fi";

          const stopCatalog = await getJson(`${base}/siri/sm`);
          if (!stopCatalog || Array.isArray(stopCatalog) || typeof stopCatalog !== "object") {
            throw new Error("SIRI stop catalog is not an object.");
          }

          const stopId = Object.keys(stopCatalog).find((id) => /^\d+$/.test(id));
          if (!stopId) throw new Error("SIRI stop catalog has no numeric stop IDs.");

          const monitor = await getJson(`${base}/siri/sm/${stopId}`);
          if (!monitor || typeof monitor !== "object" || Array.isArray(monitor)) {
            throw new Error("Stop Monitoring payload is not an object.");
          }
          if (!["OK", "NO_SIRI_DATA"].includes(monitor.status)) {
            throw new Error(`Unexpected Stop Monitoring status: ${monitor.status}`);
          }
          if (monitor.status === "OK" && !Array.isArray(monitor.result)) {
            throw new Error("Usable Stop Monitoring payload has no result array.");
          }

          const gtfs = await getJson(`${base}/gtfs/`);
          if (
            !gtfs ||
            typeof gtfs !== "object" ||
            Array.isArray(gtfs) ||
            typeof gtfs.host !== "string" ||
            typeof gtfs.gtfspath !== "string" ||
            typeof gtfs.latest !== "string"
          ) {
            throw new Error("GTFS dataset metadata is invalid.");
          }

          // The app's Content-Security-Policy lets it connect only to Föli
          // hosts (scripts/content-security-policy.mjs). A dataset moved
          // anywhere else would be refused in every browser: say so here.
          if (!/^([a-z0-9-]+\.)+foli\.fi$/i.test(gtfs.host)) {
            throw new Error(
              `GTFS host ${gtfs.host} is outside *.foli.fi, which the CSP connect-src blocks.`
            );
          }

          const gtfsPath = gtfs.gtfspath.startsWith("/")
            ? gtfs.gtfspath
            : `/${gtfs.gtfspath}`;
          const gtfsBase = `https://${gtfs.host}${gtfsPath}/${encodeURIComponent(
            gtfs.latest
          )}`;

          const [stops, routes, calendar, calendarDates] = await Promise.all([
            getJson(`${gtfsBase}/stops`),
            getJson(`${gtfsBase}/routes`),
            getJson(`${gtfsBase}/calendar`),
            getJson(`${gtfsBase}/calendar_dates`),
          ]);

          if (!stops || Array.isArray(stops) || typeof stops !== "object") {
            throw new Error("Pinned GTFS stops payload is not an object.");
          }

          if (!Array.isArray(routes)) {
            throw new Error("Pinned GTFS routes payload is not an array.");
          }

          if (!calendar || Array.isArray(calendar) || typeof calendar !== "object") {
            throw new Error("Pinned GTFS calendar payload is not an object.");
          }

          if (
            !calendarDates ||
            Array.isArray(calendarDates) ||
            typeof calendarDates !== "object"
          ) {
            throw new Error("Pinned GTFS calendar_dates payload is not an object.");
          }

          const stopTimesAtStop = await getJson(
            `${gtfsBase}/stop_times/stop/${encodeURIComponent(stopId)}`
          );
          if (!Array.isArray(stopTimesAtStop)) {
            throw new Error("Pinned GTFS stop timetable is not an array.");
          }

          const routeId = routes.find((route) => route?.route_id)?.route_id;
          if (!routeId) throw new Error("Pinned GTFS routes have no route_id.");

          const routeTrips = await getJson(
            `${gtfsBase}/trips/route/${encodeURIComponent(routeId)}`
          );
          if (!Array.isArray(routeTrips) || routeTrips.length === 0) {
            throw new Error("Pinned GTFS route trip lookup is unusable.");
          }

          const tripId = routeTrips.find((trip) => trip?.trip_id)?.trip_id;
          if (!tripId) throw new Error("Pinned GTFS route trips have no trip_id.");

          const [tripDetails, tripStops, boundary] = await Promise.all([
            getJson(`${gtfsBase}/trips/trip/${encodeURIComponent(tripId)}`),
            getJson(`${gtfsBase}/stop_times/trip/${encodeURIComponent(tripId)}`),
            getJson(`${base}/geojson/bounds/compact`),
          ]);

          if (!Array.isArray(tripDetails) || tripDetails.length === 0) {
            throw new Error("Pinned GTFS trip lookup is unusable.");
          }
          if (!Array.isArray(tripStops) || tripStops.length === 0) {
            throw new Error("Pinned GTFS trip stop sequence is unusable.");
          }
          if (
            boundary?.type !== "FeatureCollection" ||
            !Array.isArray(boundary.features) ||
            !boundary.features.some(
              (feature) => feature?.geometry?.type === "MultiPolygon"
            )
          ) {
            throw new Error("Compact Föli service boundary is invalid.");
          }

          const alerts = await getJson(`${base}/alerts`);
          if (!alerts || Array.isArray(alerts) || typeof alerts !== "object") {
            throw new Error("Alerts payload is not an object.");
          }

          console.log(
            JSON.stringify(
              {
                checkedStop: stopId,
                stopMonitoringStatus: monitor.status,
                gtfsDataset: gtfs.latest,
                gtfsStops: Object.keys(stops).length,
                gtfsRoutes: routes.length,
                gtfsCalendarServices: Object.keys(calendar).length,
                gtfsCalendarDateServices: Object.keys(calendarDates).length,
                checkedRoute: routeId,
                checkedTrip: tripId,
                stopTimetableRows: stopTimesAtStop.length,
                tripStopRows: tripStops.length,
                compactBoundaryFeatures: boundary.features.length,
                alertKeys: Object.keys(alerts),
              },
              null,
              2
            )
          );
          NODE
