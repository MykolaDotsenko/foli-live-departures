name: Publish Android test APK

on:
  workflow_run:
    workflows: ["Android APK E2E"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: >-
    ${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      'android-latest' ||
      format('non-publishing-android-{0}', github.run_id)
    }}
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      actions: read
      contents: write

    steps:
      - name: Download the exact APK exercised by Android E2E
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name android-e2e-evidence \
            --dir tested-artifact

          test -s tested-artifact/android/app/build/outputs/apk/debug/app-debug.apk
          test -s tested-artifact/apk-sha256.txt

      - name: Verify and normalize tested APK
        shell: bash
        run: |
          set -euo pipefail
          (
            cd tested-artifact
            sha256sum -c apk-sha256.txt
          )
          cp tested-artifact/android/app/build/outputs/apk/debug/app-debug.apk \
            Turku-Departures.apk
          sha256sum Turku-Departures.apk > Turku-Departures.apk.sha256

      - name: Publish stable Android test download
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          tag="android-latest"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release delete "$tag" --cleanup-tag --yes
          else
            gh api \
              --method DELETE \
              "/repos/$GITHUB_REPOSITORY/git/refs/tags/$tag" \
              >/dev/null 2>&1 || true
          fi

          gh release create "$tag" \
            Turku-Departures.apk \
            Turku-Departures.apk.sha256 \
            --target "$VERIFIED_SHA" \
            --title "Turku Departures Android APK" \
            --prerelease \
            --notes "Debug-signed Android sideload build from commit \`$VERIFIED_SHA\`. This exact APK completed the Android emulator E2E workflow before publication. It is a testing artifact, not the production-signed Android release."
