name: Bootstrap Föli address pack

on:
  push:
    branches:
      - feature/production-hardening-99

permissions:
  contents: write

concurrency:
  group: bootstrap-foli-address-pack
  cancel-in-progress: true

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/production-hardening-99

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build address pack
        shell: bash
        run: |
          set -euo pipefail
          endpoints=(
            "https://overpass-api.de/api/interpreter"
            "https://overpass.kumi.systems/api/interpreter"
            "https://overpass.nchc.org.tw/api/interpreter"
          )
          built=0
          for endpoint in "${endpoints[@]}"; do
            if npm run build:address-pack -- --endpoint "$endpoint"; then
              built=1
              break
            fi
          done
          test "$built" -eq 1

      - name: Verify address pack
        run: npm run verify:address-pack

      - name: Commit real dataset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin feature/production-hardening-99
          git add public/addresses/foli-addresses.json
          git diff --cached --quiet && exit 0
          git commit -m "Build Föli offline address pack"
          git push
