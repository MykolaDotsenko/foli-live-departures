name: Android APK E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-e2e.yml"
      - "scripts/android-webview-e2e.mjs"
      - "scripts/run-android-emulator-e2e.sh"
      - "scripts/build-sw.mjs"
      - "scripts/configure-android-active-ride.mjs"
      - "scripts/verify-android-play-target.mjs"
      - "scripts/verify-play-*.mjs"
      - "scripts/build-play-store-assets.mjs"
      - "e2e/play-store-screenshots.spec.js"
      - "play/**"
      - "docs/ANDROID_RELEASE.md"
      - "docs/PRODUCTION_READINESS.md"
      - "docs/PRODUCTION_ROADMAP.md"
      # Release-governance docs participate in exact-SHA Android evidence.
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.json"
      - "vite.config.*"

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Install Android test toolchain
        run: |
          npm install --no-save \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            chrome-remote-interface

      - name: Build web application
        env:
          VITE_BASE_PATH: /
          VITE_NATIVE_BUILD: "true"
          VITE_BUILD_SHA: ${{ github.sha }}
        run: npm run build

      - name: Verify native provider trust boundary
        run: npm run verify:native-boundary

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android active-ride bridge and WebView debugging
        run: npm run configure:android-active-ride -- --webview-debug

      - name: Verify Google Play API target and permission surface
        run: npm run verify:android-play-target

      - name: Build debug APK
        working-directory: android
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if ./gradlew assembleDebug --no-daemon; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Gradle build failed after 3 attempts."
              exit 1
            fi
            echo "Gradle build attempt $attempt failed; retrying after a short delay."
            sleep $((attempt * 10))
          done

      - name: Validate APK structure
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > artifacts-apk-list.txt
          grep -q "assets/public/index.html" artifacts-apk-list.txt
          grep -q "assets/public/manifest.webmanifest" artifacts-apk-list.txt
          grep -q "assets/capacitor.config.json" artifacts-apk-list.txt
          grep -q "AndroidManifest.xml" artifacts-apk-list.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The WebView scenario includes persisted Ukrainian/Swedish locale
      # selection/reload checks before returning to English for legacy flow QA.
      - name: Run Android emulator E2E
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-android-emulator-e2e.sh

      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-e2e-evidence
          path: |
            artifacts/android-e2e
            artifacts-apk-list.txt
            apk-sha256.txt
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
