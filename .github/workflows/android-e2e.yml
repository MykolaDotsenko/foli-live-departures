name: Android APK E2E

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android-e2e.yml"
      - "scripts/android-webview-e2e.mjs"
      - "scripts/run-android-emulator-e2e.sh"

permissions:
  contents: read

jobs:
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install web dependencies
        run: npm ci

      - name: Install Android test toolchain
        run: |
          npm install --no-save \
            @capacitor/core@8.5.2 \
            @capacitor/cli@8.5.2 \
            @capacitor/android@8.5.2 \
            chrome-remote-interface

      - name: Build web application
        env:
          VITE_BASE_PATH: /
        run: npm run build

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "fi.turku.folilivedepartures",
            "appName": "Turku Föli",
            "webDir": "dist",
            "server": {
              "androidScheme": "https"
            },
            "android": {
              "allowMixedContent": false
            }
          }
          JSON

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions and WebView debugging
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = [
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
          ]

          marker = "<application"
          lines = []
          for permission in permissions:
              token = f'android:name="{permission}"'
              if token not in text:
                  lines.append(
                      f'    <uses-permission android:name="{permission}" />'
                  )

          if lines:
              text = text.replace(
                  marker,
                  "\n".join(lines) + "\n\n    " + marker,
                  1,
              )
          manifest.write_text(text)

          main = Path(
              "android/app/src/main/java/fi/turku/folilivedepartures/MainActivity.java"
          )
          main.write_text(
              """package fi.turku.folilivedepartures;

          import android.os.Bundle;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView.setWebContentsDebuggingEnabled(true);
              }
          }
          """
          )
          PY

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Validate APK structure
        run: |
          set -euxo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -l "$APK" > artifacts-apk-list.txt
          grep -q "assets/public/index.html" artifacts-apk-list.txt
          grep -q "assets/public/manifest.webmanifest" artifacts-apk-list.txt
          grep -q "assets/capacitor.config.json" artifacts-apk-list.txt
          grep -q "AndroidManifest.xml" artifacts-apk-list.txt
          sha256sum "$APK" | tee apk-sha256.txt

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android emulator E2E
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash scripts/run-android-emulator-e2e.sh

      - name: Upload Android E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-e2e-evidence
          path: |
            artifacts/android-e2e
            artifacts-apk-list.txt
            apk-sha256.txt
            android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
