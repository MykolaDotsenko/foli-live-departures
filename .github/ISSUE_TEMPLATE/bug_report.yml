name: Report a problem
description: Tell us when Turku Departures behaves incorrectly or is hard to use.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Turku Departures.

        Please do **not** post a home address, exact GPS history, phone number, ticket details or other unnecessary personal information.
  - type: dropdown
    id: area
    attributes:
      label: What were you using?
      options:
        - Departures
        - Stop search / nearby stops
        - Get-off Alert
        - Get me Home / My Places
        - Service updates
        - Offline / PWA
        - Theme / language / accessibility
        - Something else
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened?
      placeholder: Describe what you saw and the action immediately before it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: stop
    attributes:
      label: Public stop or line, if relevant
      description: A public stop name/number or bus line is enough. Do not include an address.
      placeholder: e.g. Kauppatori 164 / line 1
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. Pixel 8 · Chrome / iPhone · Safari
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed unnecessary personal information from this report.
          required: true
