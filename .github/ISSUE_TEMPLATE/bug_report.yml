name: Report a problem / Ilmoita ongelmasta
description: Tell us when Turku Departures behaves incorrectly or is hard to use. / Kerro, jos Turku Departures toimii väärin tai sitä on vaikea käyttää.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Turku Departures. You can write in English or Finnish.

        Please do **not** post a home address, exact GPS history, phone number, ticket details or other unnecessary personal information.

        Kiitos, että autat parantamaan Turku Departures -sovellusta. Voit kirjoittaa suomeksi tai englanniksi.

        **Älä** kirjoita kotiosoitetta, tarkkaa sijaintihistoriaa, puhelinnumeroa, lipputietoja tai muita tarpeettomia henkilötietoja.
  - type: dropdown
    id: area
    attributes:
      label: What were you using? / Mitä käytit?
      options:
        - Departures / Lähdöt
        - Stop search or Near you / Pysäkkihaku tai Lähelläsi
        - Get-off alert / Pysäkkihälytys
        - Get me Home or My Places / Vie minut kotiin tai Omat paikat
        - Service updates / Liikennetiedotteet
        - Offline or installed app / Ilman yhteyttä tai asennettu sovellus
        - Theme, language or accessibility / Teema, kieli tai saavutettavuus
        - Something else / Jokin muu
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened? / Mitä tapahtui?
      placeholder: Describe what you saw and what you did just before it. / Kerro, mitä näit ja mitä teit juuri ennen sitä.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect? / Mitä odotit?
    validations:
      required: true
  - type: input
    id: stop
    attributes:
      label: Stop or line, if relevant / Pysäkki tai linja, jos liittyy asiaan
      description: A public stop name or number, or a bus line, is enough. Do not include an address. / Pysäkin nimi tai numero tai bussilinja riittää. Älä kirjoita osoitetta.
      placeholder: e.g. Kauppatori 164 / line 1 · esim. Kauppatori 164 / linja 1
  - type: input
    id: device
    attributes:
      label: Device and browser / Laite ja selain
      placeholder: e.g. / esim. Pixel 8 · Chrome / iPhone · Safari
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / Tietosuoja
      options:
        - label: I have removed unnecessary personal information from this report. / Olen poistanut ilmoituksesta tarpeettomat henkilötiedot.
          required: true
